name: Build Release Mod JARs

on:
  push:
    branches:
      - 1.20.x
  pull_request:
    branches:
      - 1.20.x

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        loader: [fabric, forge]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build ${{ matrix.loader }} mod
        run: ./gradlew :${{ matrix.loader }}:build --no-daemon --console=plain
      
      - name: Upload ${{ matrix.loader }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.loader }}-build
          path: ${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error
